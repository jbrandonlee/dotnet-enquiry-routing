name: dotnet_enquiryrouting

services:
  enquiryrouting.api:
    build:
      context: .
      dockerfile: src/Dockerfile
    ports:
      - 8080:8080
      - 8081:8081
    environment:
      - ConnectionStrings__Database=Host=enquiryrouting.database;Port=5432;Database=${DB_DATABASE};Username=${DB_USER};Password=${DB_PASSWORD};Include Error Detail=True;
    depends_on:
      enquiryrouting.database:
        condition: service_healthy
    restart: always

  enquiryrouting.database:
    image: postgres:latest
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./.container/database:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  